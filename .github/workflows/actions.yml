name: Push latest
on:
  push:
    branches:
      - develop
      - feature/*
jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@main
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@master
    - name: Build and export
      uses: docker/build-push-action@master
      with:
        context: .
        tags: islasgeci/api_caller:latest
        outputs: type=docker,dest=/tmp/image.tar
    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: image
        path: /tmp/image.tar

  run-tests:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Download artifact
        uses: actions/download-artifact@main
        with:
          name: image
          path: /tmp
      - name: Load image
        run: |
          docker load --input /tmp/image.tar
          docker image ls -a
      - name: Verifica el formato
        run: docker run islasgeci/api_caller:latest make check
      - name: Corre pruebas y evalúa cobertura
        run: docker compose run islasgeci make coverage
      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          verbose: true
      - name: Teardown services
        run: |
          docker compose down
  deploy-image-and-package:
    needs: [run-tests]
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@main
    - name: Create/Update tag
      uses: rickstaa/action-create-tag@v1.5.4
      with:
        tag: "latest"
        message: "Latest release"
        force_push_tag: true
    - name: Download artifact
      uses: actions/download-artifact@main
      with:
        name: image
        path: /tmp
    - name: Load image
      run: |
        docker load --input /tmp/image.tar
        docker image ls -a
    - name: Docker log-in
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
    - name: Sube latest a Docker Hub
      run: docker push islasgeci/api_caller:latest
    - name: Add github sha tag to Docker image
      run: docker tag islasgeci/api_caller:latest islasgeci/api_caller:${GITHUB_SHA:0:4}
    - name: Sube sha a Docker Hub
      run: docker push islasgeci/api_caller:${GITHUB_SHA:0:4}
    - name: Build and publish Python 🐍 distributions 📦 to PyPI
      uses: actions/setup-python@v5
      with:
        python-version: 3.9
    - name: Install pypa/build
      run: >-
        python -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: >-
        python -m
        build
        --sdist
        --wheel
        --outdir dist/
        .
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_TOKEN }}
        skip-existing: true
  cleanup-artifacts:
    name: Delete temporary artifacts
    if: always()
    needs: [deploy-image-and-package]
    runs-on: ubuntu-latest
    steps:
      - name: Delete Docker image artifact
        uses: geekyeggo/delete-artifact@main
        with:
          name: image
